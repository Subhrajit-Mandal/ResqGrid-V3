name: V3 checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r ai/requirements.txt
      - run: PYTHONPATH=backend:ai/src pytest tests/backend -q
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/resqgrid-preview.log 2>&1 &
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
